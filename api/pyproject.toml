[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "joblib>=1.6.0",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    # Pinned exactly. The service unpickles forests written by this version and
    # sklearn makes no cross-version guarantee about pickled estimators.
    "scikit-learn==1.9.0",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]

sources = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# Training only. The serving image installs with --no-group training; sklearn
# stays a runtime dependency because loading a bundle unpickles a forest.
training = [
    "pandas>=3.0.5",
]
# Desktop app only: native window and installer build. Sync with
# `uv sync --group desktop --no-group training`.
desktop = [
    "platformdirs>=4.3.0",
    "pyinstaller>=6.11.0",
    "pywebview>=5.4",
]

[tool.uv]
default-groups = ["dev", "training"]
