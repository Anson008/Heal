# Requests reach us through cloudflared and the docker bridge, so the peer is
# always the gateway. Without this every client shares one rate limit bucket.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;

# 12r/m rather than 6, because compare mode spends two requests per run.
limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=12r/m;
limit_req_zone  $binary_remote_addr zone=health_limit:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;
    server_name healstrata.com www.healstrata.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name healstrata.com www.healstrata.com;

    ssl_certificate /etc/nginx/ssl/healstrata.com.pem;
    ssl_certificate_key /etc/nginx/ssl/healstrata.com.key;

    # The service accepts up to config.MAX_PIXELS (64 MP) at 1 m per pixel, so a
    # request inside the model's 3000 ha envelope is tens of megabytes of PNG.
    # The pixel count is the backend's check to make, not nginx's.
    client_max_body_size 64M;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # Cheap, so it gets its own budget rather than spending the prediction one.
    # A monitor polling once a second fits inside this.
    location = /api/health {
        limit_req zone=health_limit burst=10 nodelay;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://api:8000/health;
    }

    location /api/ {
        # Compare mode sends both images at once, so one run needs two
        # connections. nodelay matters: a queued request holds its connection
        # open and would collide with its own sibling on the conn limit.
        limit_req zone=api_limit burst=4 nodelay;
        limit_conn perip 2;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        # Classifying and measuring a full-size image is slow and runs inline.
        proxy_read_timeout    120s;

        # Starlette builds its redirects from these; without them a redirect
        # points the browser at the internal api:8000, and here downgrades it
        # to http.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://api:8000/;
    }
}