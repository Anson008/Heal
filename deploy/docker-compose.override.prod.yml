services:
  api:
    restart: unless-stopped
    image: ghcr.io/healstrata-tech/healstrata-api:prod
    container_name: healstrata-prod-api
    env_file:
      - /opt/healstrata/secrets.env
    environment:
      DOWNLOAD_MODELS: "true"

  web:
    restart: unless-stopped
    image: ghcr.io/healstrata-tech/healstrata-web:prod
    container_name: healstrata-prod-web
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - /opt/healstrata/ssl:/etc/nginx/ssl:ro
      - /opt/healstrata/deploy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro